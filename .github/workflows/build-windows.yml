name: Windows build

# Builds the game for Windows on GitHub's runners and publishes the zip as a Release.
# Pushes to main refresh a rolling "latest" release; a v* tag makes its own release.
# Nothing is uploaded as a workflow artifact, so Actions storage is never used.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-release

      - name: Build release binary
        run: cargo build --release --locked -p pixelgm

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\pixelgm.exe dist\PixelGM.exe
          Copy-Item NOTICE.md dist\NOTICE.md
          Compress-Archive -Path dist\* -DestinationPath PixelGM-windows-x64.zip -Force

      - name: Publish release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { 'latest' }
          $zip = 'PixelGM-windows-x64.zip'

          if (gh release view $tag 2>$null) {
            gh release upload $tag $zip --clobber
          } else {
            $notes = "Automated Windows build of $env:GITHUB_SHA on $env:GITHUB_REF_NAME."
            gh release create $tag $zip --title "PixelGM $tag" --notes $notes --latest
          }
