[workspace]
resolver = "3"
members = ["crates/llm", "crates/world", "crates/rules", "crates/net", "crates/table", "crates/game"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Bevy is unusable unoptimised; the game's own code stays quick to rebuild.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# What is given to players: no debugger's data in it, and nothing left in the file that is
# only for reading a crash by hand.
[profile.release]
debug = false
strip = "symbols"
